<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{% block title %}LiuliDNS 后台{% endblock %}</title>
<style>
  :root{--bg:#07111c;--panel:rgba(255,255,255,.06);--line:rgba(160,220,235,.18);--text:#e6f4f8;--muted:#8fb3c2;--accent:#57e0c8;--danger:#ff7a7a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(1200px 700px at 15% -10%,#123b4d 0,transparent 60%),radial-gradient(900px 600px at 100% 10%,#1a2a63 0,transparent 55%),var(--bg);color:var(--text);font:14px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;margin-bottom:22px;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(18px)}
  header h1{margin:0;font-size:17px;letter-spacing:.6px}
  nav a{color:var(--muted);text-decoration:none;margin-left:18px;font-size:13px}
  nav a:hover{color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .card{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:18px;backdrop-filter:blur(14px)}
  .kpi{font-size:26px;font-weight:600;color:var(--accent)}
  .label{color:var(--muted);font-size:12px;letter-spacing:.4px}
  h2{font-size:15px;margin:26px 0 10px;color:#cfe9f1;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:top}
  th{color:var(--muted);font-weight:500}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  input,button,textarea{font:inherit}
  input[type=text],input[type=password],textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--text);outline:none}
  input:focus{border-color:var(--accent)}
  button{padding:9px 16px;border-radius:10px;border:1px solid rgba(87,224,200,.45);background:rgba(87,224,200,.14);color:#d8fff8;cursor:pointer}
  button:hover{background:rgba(87,224,200,.24)}
  button.ghost{border-color:var(--line);background:transparent;color:var(--muted)}
  button.danger{border-color:rgba(255,122,122,.5);background:rgba(255,122,122,.12);color:#ffdada}
  .flash{margin:0 0 16px;padding:10px 14px;border-radius:12px;border:1px solid rgba(87,224,200,.35);background:rgba(87,224,200,.1);color:#c9fff6}
  .err{border-color:rgba(255,122,122,.4);background:rgba(255,122,122,.1);color:#ffdada}
  .muted{color:var(--muted)}
  .auth{max-width:420px;margin:8vh auto}
  .auth .card{padding:26px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:var(--muted)}
  .pill.ok{color:#a6ffe9;border-color:rgba(87,224,200,.4)}
  .pill.bad{color:#ffc5c5;border-color:rgba(255,122,122,.4)}
  .bigcode{font-size:28px;letter-spacing:3px;color:#a9fff1;margin:18px 0;padding:16px;border:1px dashed rgba(87,224,200,.5);border-radius:12px;text-align:center;user-select:all}
</style>
</head>
<body><div class="wrap">
{% if not hide_header %}
<header>
  <h1>琉璃域名 · 后台</h1>
  <nav>
    <a href="/admin/dashboard">总览</a>
    <a href="/admin/users">用户与发码</a>
    <a href="/admin/audit">审计日志</a>
    <a href="/admin/logout">退出</a>
  </nav>
</header>
{% endif %}
{% block content %}{% endblock %}
</div></body></html>
