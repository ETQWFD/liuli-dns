{% extends "base.html" %}
{% set hide_header = true %}
{% block title %}两步验证{% endblock %}
{% block content %}
<div class="auth">
  <div class="card">
    <h1 style="font-size:20px;margin:0 0 6px">两步验证</h1>
    <p class="muted" style="margin:0 0 18px">请输入认证器中的 6 位动态口令。</p>
    {% if error %}<p class="flash err">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/2fa">
      <input type="text" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required style="letter-spacing:6px;text-align:center;font-size:20px;margin-bottom:16px">
      <button type="submit" style="width:100%">验证并进入</button>
    </form>
  </div>
</div>
{% endblock %}
