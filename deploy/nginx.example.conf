# LiuliDNS API reverse proxy example.  Put certificates issued by your CA here.
# DNS is NOT proxied by nginx: registrars must reach UDP+TCP 53 directly.

upstream liuli_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.liuli.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.liuli.example;

    ssl_certificate     /etc/letsencrypt/live/api.liuli.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.liuli.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://liuli_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Admin console: consider an IP allowlist in addition to password + TOTP.
    location /admin {
        # allow 203.0.113.0/24;
        # deny all;
        proxy_pass http://liuli_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
